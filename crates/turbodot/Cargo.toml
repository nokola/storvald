[package]
name = "turbodot"
description = "TurboDot: the app and game engine where AI can prove that its changes work. Headless, deterministic, high-performance. In development: this version shows one gogo page in a window, and draws it to a picture with no window."
keywords = ["gamedev", "game-engine", "ai", "agent", "headless"]
categories = ["game-engines", "game-development"]
readme = "../../README.md"
# These tests draw text with a font from `assets/Fonts` at the top of the
# repository, which a crates.io package does not carry, so they stay out
# of the package (`scripts/test-packages.sh` checks that `cargo test`
# passes on it).
exclude = ["tests/page.rs", "tests/pages.rs", "tests/allocations.rs"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["window"]
# Pages that run with no window and no GPU: `Program`, `Page`, `Ui`.
ui = ["dep:gogo-text"]
# A GPU device with no window (`Gpu`), and pages drawn to a `Picture`.
# Takes `ui` with it.
gpu = ["ui", "dep:gogo-wgpu", "dep:png", "dep:pollster", "dep:wgpu"]
# Pages in a window (`start`). Takes `gpu` with it.
window = ["gpu", "dep:winit"]
# A page that comes from a file follows that file while the program runs.
# A program you ship leaves the feature off; the same code then reloads
# nothing.
hot-reload = ["gogo-ui/hot-reload"]

# With `default-features = false` only gogo's language is built: that is
# what a build script takes for `turbodot::build::pages`, so it compiles
# no text engine, no window and no GPU crate (`tests/manifest.rs` holds
# the list to that). A crate that holds an app's own pages adds `ui`.
[dependencies]
gogo-text = { path = "../gogo-text", version = "0.5.0", optional = true }
gogo-ui = { path = "../gogo-ui", version = "0.5.0" }
gogo-wgpu = { path = "../gogo-wgpu", version = "0.5.0", optional = true }
# Writes a page's picture as a PNG file.
png = { version = "0.18.1", optional = true }
pollster = { version = "1.0.1", optional = true }
# The engine is the one that picks wgpu's backends: the default set here.
wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30.13", optional = true }

[dev-dependencies]
# Reads a saved picture back, to check the file against the pixels.
png = "0.18.1"
