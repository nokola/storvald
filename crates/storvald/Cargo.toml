[package]
name = "storvald"
description = "Storvald: an AI-first creative environment for unslop games and apps. In development: this version is the `storvald` command with one window, which lists the system skills it carries."
keywords = ["gamedev", "ai", "agent", "ide", "tooling"]
categories = ["development-tools", "game-development"]
readme = "../../README.md"
# This test reads `.claude/skills` at the top of the repository, which a
# crates.io package does not carry, so it stays out of the package
# (`scripts/test-packages.sh` checks that `cargo test` passes on it).
exclude = ["tests/agent_copies.rs"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `hot-reload`: a debug build run from this repository follows the pages'
# files in `ui/` while its window is open. Every other build carries the
# pages as they were built and reads no file, so the feature does nothing
# there.
turbodot = { path = "../turbodot", version = "0.5.0", features = ["hot-reload"] }

# The build script compiles the pages in `ui/` (`turbodot::build::pages`).
# With no feature on, TurboDot builds gogo's language alone.
[build-dependencies]
turbodot = { path = "../turbodot", version = "0.5.0", default-features = false }
